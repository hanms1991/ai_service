<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAgent</title>
  <link rel="stylesheet" href="style.css?v=20261003a" />
</head>
<body>
  <div class="layout">
    <!-- 左侧栏 -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <span class="brand">AutoAgent</span>
      </div>
      <button class="btn-new" id="btn-new">＋ 新建对话</button>
      <div class="conv-list" id="conv-list"></div>
      <div class="sidebar-user">
        <span class="avatar" id="user-avatar">?</span>
        <span class="user-name" id="user-name">…</span>
        <button class="icon-btn" id="btn-logout" title="退出登录">⎋</button>
      </div>
    </aside>

    <!-- 主对话区 -->
    <main class="main">
      <div class="topbar">
        <span class="topbar-title" id="topbar-title"></span>
        <div class="topbar-controls">
          <select class="model-select" id="model-select" title="切换 LLM 模型（全局生效）">
          </select>
          <select class="scene-select" id="scene-select" title="功能场景（默认智能编排）">
            <option value="">智能编排</option>
          </select>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <div class="big">AutoAgent</div>
          <div>输入问题开始对话；可上传文档并发起 HARA 等功能分析</div>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <!-- 已上传文档 + 本会话交付物 -->
          <div class="chips" id="chips"></div>
          <div class="composer-row">
            <button class="btn-attach" id="btn-attach" title="上传文档">📎</button>
            <input type="file" id="file-input" class="hidden"
              accept=".docx,.doc,.xlsx,.pptx,.pdf,.txt,.md,.csv,.json,.html,.htm" />
            <textarea id="input" rows="1"
              placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
            <button class="btn-send" id="btn-send">发送</button>
          </div>
        </div>
        <div class="hint">内容由 AI 生成，请注意甄别</div>
      </div>
    </main>
  </div>
  <script src="app.js?v=20261003a"></script>
</body>
</html>
