# agents/configs/supervisor_agent.yaml
name: platform_supervisor
type: supervisor

model: core.llm:model

# system_prompt 作为 planner 的额外补充指令（planner 基础提示由代码动态生成）
system_prompt: |
  分派规则：
  1. 单点需求 → single 模式，一步完成。
  2. 复合需求 → chain 模式，按功能定义 → 干系人 → PRD 的顺序依次调用，
     把上一步输出作为下一步输入。
  3. 若用户意图不清 → ask 模式，先追问。
  4. 涉及高风险操作 → confirm 模式，等待人工确认。

tools:
  # 子 agent 成员：planner 可调度，executor 通过 registry 调用
  - agent: product_agent
    description: 把功能诉求转化为结构化功能定义。输入原始诉求，输出功能定义。
    risk_level: low          # low=直接执行 / high=需 confirm 人工确认
