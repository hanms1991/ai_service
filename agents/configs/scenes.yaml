# 场景码 → (agent, skill) 映射，后端只传 scene，不传 agent/skill 名称
# 改名/拆分/换 Agent 时只需改本文件，后端零改动
scenes:
  ONE_CLICK_EXPAND:
    description: 一键扩写功能说明（50~100字）
    agent: product_agent
    skill: feature_expand
    response_format: text          # text | json
    timeout_seconds: 30            # 可覆盖请求级默认超时

  PRD_GENERATE:
    description: 生成完整汽车功能 PRD 文档（Markdown）
    agent: product_agent
    skill: prd_generation
    response_format: text
    timeout_seconds: 600            # PRD 8 章节长文档，实测 3-5 分钟，给 10 分钟余量

  # 以下场景码已弃用（对应 skill 已从 product_agent.yaml 的 skills 列表移除）
