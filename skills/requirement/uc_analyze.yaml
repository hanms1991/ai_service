name: uc_analyze
display_name: 用例分析
description: 基于系统/功能描述，识别参与者、圈定系统边界、提取用例并梳理用例关系，输出结构化用例分析结果与用例图建议。
version: 1.0.0
risk_level: low
domain:
  - 需求工程
  - 系统分析
tags:
  - 用例分析
  - Use Case
  - 参与者
  - 系统边界
  - UML

model_hint:
  reasoning: enabled

inputs:
  system_description:
    type: string
    required: true
    desc: 目标系统/功能描述，例如在线商城系统、车载座舱系统、AEB 系统
  business_goals:
    type: string
    required: false
    desc: 业务目标、范围说明、成功标准
  known_actors:
    type: string
    required: false
    desc: 已知参与者，例如用户、管理员、支付系统、定时任务
  system_boundary:
    type: string
    required: false
    desc: 目标系统边界说明；未提供时根据系统描述推断，并标注“待确认”
  supplementary:
    type: string
    required: false
    desc: 其他补充信息，可整段粘贴：候选用例、关系约束、异常分支、可选流程、建模标准等

output:
  format: markdown
  schema: |
    ## 分析范围
    ...
    ## 参与者清单
    | 参与者 | 类型 | 判断依据 |
    |---|---|---|
    ...
    ## 系统边界
    ...
    ## 用例清单
    | 用例 ID | 用例名称 | 主参与者 | 业务目标 | 是否在系统边界内 | 说明 |
    |---|---|---|---|---|---|
    ...
    ## 用例关系
    | 关系类型 | 源 | 目标 | 说明 |
    |---|---|---|---|
    ...
    ## 用例图建议
    ...
    ## 校验清单
    - [ ] ...
    - [ ] ...

prompt_template: |
  请根据以下输入，完成用例分析（Use Case Analysis）。

  【系统描述】：{{system_description}}
  【业务目标】：{{business_goals}}
  【已知参与者】：{{known_actors}}
  【系统边界】：{{system_boundary}}
  【补充信息】：{{supplementary}}

  分析规则：
  1. 找参与者（Actor）：
     - 参与者是和系统交互的外部角色，分 3 种：人角色、外部系统、时间/定时器。
     - 判断口诀：谁主动发起操作、谁给系统传数据、谁接收系统结果，谁就是参与者。
     - 示例：用户登录商城，下单，支付系统处理付款，管理员后台查订单。参与者：用户、支付系统、管理员。
  2. 圈定系统边界：
     - 确定目标系统范围，框内是系统功能（用例），框外全是参与者。
     - 例如目标为在线商城系统，则框内为商城自身功能，支付系统在框外。
  3. 提取用例（Use Case）：
     - 用例是系统给参与者提供的一个完整可达成的目标功能。
     - 规范命名：动宾短语，例如登录账户、提交订单、退款、查询账单。
     - 错误命名：点击按钮、输入密码，这些只是步骤，不是完整目标。
     - 筛选规则：必须在系统边界内部；一个用例对应一个业务目标；细碎操作合并，不要拆太碎。
  4. 梳理用例关系：
     - 关联线：参与者 ↔ 用例，谁操作谁连直线。
     - 包含 <<include>>：基础用例必须调用公共小用例，箭头指向被包含用例。
       例：提交订单【包含】验证登录。
     - 扩展 <<extend>>：正常流程之外的分支、异常、可选流程，箭头指向基础用例。
       例：支付失败【扩展】提交订单；优惠券抵扣【扩展】结算。
     - 泛化：子参与者继承父参与者能力。
       例：VIP 会员 泛化于 普通用户；超级管理员 泛化于 管理员。

  输出要求：
  1. 使用 Markdown 输出，包含“分析范围”“参与者清单”“系统边界”“用例清单”“用例关系”“用例图建议”“校验清单”。
  2. 参与者清单至少包含：参与者、类型、判断依据。
  3. 系统边界说明框内系统功能与框外参与者；若边界不明确，标注“待确认”。
  4. 用例清单至少包含：用例 ID、用例名称、主参与者、业务目标、是否在系统边界内、说明。
  5. 用例关系表至少包含：关系类型、源、目标、说明。
  6. 用例命名必须为动宾短语；错误示例：点击按钮、输入密码。
  7. 只基于输入信息分析，不编造具体字段、接口、数值、权限或业务规则；信息不足时明确标注“待确认”。
  8. 如输入支持，给出 Mermaid 用例图或文字版关系图建议。
  9. 总字数控制在 400～1000 字（不含表格与图代码符号）。