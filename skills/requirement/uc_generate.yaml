name: uc_generate
display_name: 用例生成（PRD → UC）
description: 基于 PRD 文档（功能详细说明中的 L3 功能点与 6 要素描述）生成结构化用例规格，包含用例 ID、参与者、前置条件、主事件流、备选/异常流、后置条件与 PRD 追溯关系。
version: 1.0.0
risk_level: low
domain:
  - 需求工程
  - 系统分析
tags:
  - Use Case
  - 用例规格
  - PRD
  - 需求工程
  - 汽车电子

model_hint:
  reasoning: enabled

# 后端 API 调用（scene=FROM_PRD_CREATE_UC）不传 inputs，PRD 正文在 reference_data.prd_markdown；
# 所有输入均可选，避免必填校验阻断后端直达。
inputs:
  scope:
    type: string
    required: false
    desc: 用例生成范围限定，如仅针对某几个 L2/L3 功能；未提供时覆盖 PRD 中全部 L3 功能点
  project:
    type: string
    required: false
    desc: 项目/平台名称，用于用例 ID 命名上下文；未提供时从 PRD 推断

execution:
  prepare:
    # 前置钩子：向天枢后端查询 UC 模板，把字段结构注入 prompt（拉取失败走内置默认模板）
    script: scripts/fetch_uc_template.py
    entrypoint: prepare

system_prompt: |
  你是资深汽车 E/E 需求工程师，精通用例驱动需求工程（RUP/Cockburn 用例方法）。
  你的任务是把 PRD 中的功能描述转化为结构化、可验证、可追溯的用例规格。
  只输出 JSON 对象，不要附加任何解释性文字、Markdown 围栏或代码块标记。

output:
  format: json
  # 多用例大 JSON 可能很长，取 24576 覆盖全量 L3 功能点的用例规格
  max_tokens: 24576
  schema:
    type: object
    required: [use_cases]
    properties:
      use_cases:
        type: array
        items:
          type: object
          required:
            - name
            - description
            - actors
            - preconditions
            - scenario
            - postconditions
            - extensions
            - hmi
            - regulations
            - performance
            - nonfunctional
          properties:
            name: { type: string }
            description: { type: string }
            actors: { type: string }
            preconditions: { type: string }
            scenario:
              type: object
              required: [main_flow, branches, exceptions]
              properties:
                main_flow: { type: string }
                branches: { type: array, items: { type: string } }
                exceptions: { type: array, items: { type: string } }
            postconditions: { type: string }
            extensions: { type: string }
            hmi: { type: string }
            regulations: { type: string }
            performance: { type: string }
            nonfunctional: { type: string }

prompt_template: |
  请基于以下 PRD 生成结构化用例规格（Use Case Specification），输出 JSON 对象。

  【生成范围】：{{scope}}
  【项目/平台】：{{project}}

  # 输入来源
  PRD 正文在本消息末尾的【参考数据】段落中，字段名为 prd_markdown，请以其为主要事实来源。
  若参考数据中还包含【UC 模板】段落，严格按模板规定的字段与结构生成。

  # 生成规则
  1. 用例来源：以 PRD 第 3.3 功能列表中的每个 L3 功能点为基本单元；一个 L3 至少对应一个用例；
     第 4 章 6 要素中的"基本事件"映射为主事件流，"异常事件"映射为异常流，"前置条件/触发条件"映射为前置/触发条件。
  2. 用例命名：动宾短语（如"开启自动紧急制动""切换驾驶模式"），禁止以"点击/输入"等 UI 步骤命名。
  3. 主事件流 scenario.main_flow：编号步骤，每步只表达一个动作；动作主体明确（驾驶员/乘员/系统/外部参与者），步骤间用换行分隔。
  4. 备选流 scenario.branches 与异常流 scenario.exceptions：逐条列出字符串数组；
     异常描述站在用户可感知视角，不暴露 CAN/信号/ECU/传感器等工程实现细节；无则为空数组 []。
  5. 后置条件 postconditions：区分成功后置与失败后置；涉及状态保持时写明最终安全状态。
  6. 追溯：每条用例的 description 中必须标注来源 PRD 章节号（如 4.3.2）与 L3 功能名称，保证 PRD↔UC 可双向追溯。
  7. 业务规则/约束：PRD 中的触发条件、阈值类规则列入 extensions 或 performance，不混入事件流步骤。
  8. 信息不足：PRD 未覆盖的前置条件、参与者等标注"待确认"，不得编造具体信号、接口、数值或法规结论。
  9. 字段约束：只输出模板规定的 11 个字段（不含 number）；scenario 必须是嵌套对象，含 main_flow/branches/exceptions；
     不返回 candidate_id、ordinal 或任何正式对象/版本 ID。

  # 输出格式
  严格输出如下 JSON 结构（不要输出任何其他文字）：
  {
    "use_cases": [
      {
        "name": "用例名称",
        "description": "用例描述（含来源 PRD 章节与 L3 功能）",
        "actors": "参与者",
        "preconditions": "前置条件",
        "scenario": {
          "main_flow": "1. ...\n2. ...",
          "branches": ["..."],
          "exceptions": ["..."]
        },
        "postconditions": "后置条件",
        "extensions": "扩展用例/业务规则（无则填 无）",
        "hmi": "HMI交互逻辑（无则填 无）",
        "regulations": "法规需求（无则填 待确认）",
        "performance": "性能需求（无则填 待标定）",
        "nonfunctional": "非功能需求"
      }
    ]
  }
