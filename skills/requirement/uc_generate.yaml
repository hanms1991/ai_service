name: uc_generate
display_name: 用例生成（PRD → UC）
description: 基于 PRD 文档（功能详细说明中的 L3 功能点与 6 要素描述）生成结构化用例规格，包含用例 ID、参与者、前置条件、主事件流、备选/异常流、后置条件与 PRD 追溯关系。
version: 1.0.0
risk_level: low
domain:
  - 需求工程
  - 系统分析
tags:
  - Use Case
  - 用例规格
  - PRD
  - 需求工程
  - 汽车电子

model_hint:
  reasoning: enabled

# 条件必填：PRD 正文（直接粘贴）或 PRD 文档 file_id（平台读取后追加到消息）至少其一
required_any:
  - [prd_content, file_id]

inputs:
  prd_content:
    type: string
    required: false
    desc: PRD 文档正文（Markdown，可直接粘贴）；重点提供第 3.3 功能列表与第 4 章功能详细说明
  file_id:
    type: string
    required: false
    desc: 通过 /agent/files/upload 上传的 PRD 文件 file_id（docx/xlsx/pptx/pdf/txt/md）；平台自动读取为 Markdown
  scope:
    type: string
    required: false
    desc: 用例生成范围限定，如仅针对某几个 L2/L3 功能；未提供时覆盖 PRD 中全部 L3 功能点
  project:
    type: string
    required: false
    desc: 项目/平台名称，用于用例 ID 命名上下文；未提供时从 PRD 推断

document_source:
  file_id_input: file_id

system_prompt: |
  你是资深汽车 E/E 需求工程师，精通用例驱动需求工程（RUP/Cockburn 用例方法）。
  你的任务是把 PRD 中的功能描述转化为结构化、可验证、可追溯的用例规格。
  只输出 Markdown 用例规格正文，不要附加生成说明或解释性元信息。

output:
  format: markdown

prompt_template: |
  请基于以下 PRD 生成结构化用例规格（Use Case Specification）。

  【PRD 正文】：{{prd_content}}
  【生成范围】：{{scope}}
  【项目/平台】：{{project}}

  若本消息末尾附有【相关项文档（Markdown）】或类似文档段落，该段落即为 PRD 文件内容，以其为主要输入。

  # 生成规则
  1. 用例来源：以 PRD 第 3.3 功能列表中的每个 L3 功能点为基本单元；一个 L3 至少对应一个用例；
     第 4 章 6 要素中的"基本事件"映射为主事件流，"异常事件"映射为异常流，"前置条件/触发条件"映射为前置/触发条件。
  2. 用例命名：动宾短语（如"开启自动紧急制动""切换驾驶模式"），禁止以"点击/输入"等 UI 步骤命名。
  3. 主事件流：编号步骤，每步只表达一个动作；动作主体明确（驾驶员/乘员/系统/外部参与者）。
  4. 备选流与异常流：逐条列出，标注分支步骤号（如 2a、3b）、分支条件与系统兜底行为（Fail-Safe）；
     异常描述站在用户可感知视角，不暴露 CAN/信号/ECU/传感器等工程实现细节。
  5. 后置条件：区分成功后置与失败后置；涉及状态保持时写明最终安全状态。
  6. 追溯：每条用例必须标注来源 PRD 章节号（如 4.3.2）与 L3 功能名称，保证 PRD↔UC 可双向追溯。
  7. 业务规则/约束：PRD 中的触发条件、阈值类规则列入"业务规则"，不混入事件流步骤。
  8. 信息不足：PRD 未覆盖的前置条件、参与者等标注"待确认"，不得编造具体信号、接口、数值或法规结论。
  9. 用例 ID 规则：UC-<两位序号>（如 UC-01）；同一功能多个用例时连续编号。

  # 输出结构（严格按此 Markdown 模板）
  ## 1. 用例总览
  | 用例 ID | 用例名称 | 对应 L3 功能 | 主参与者 | 优先级 | 来源章节 |
  |---|---|---|---|---|---|

  ## 2. 用例规格
  ### UC-01 <用例名称>
  | 项 | 内容 |
  |---|---|
  | 用例 ID | UC-01 |
  | 用例名称 | … |
  | 主参与者 | … |
  | 次要参与者 | …（无则填 N/A） |
  | 优先级 | P0/P1/P2 |
  | 前置条件 | … |
  | 触发条件 | … |
  | 后置条件（成功） | … |
  | 后置条件（失败） | …（N/A 则标注） |

  **主事件流**
  1. …
  2. …

  **备选流**
  - 2a. <分支条件>：…（无则填"无"）

  **异常流**
  - 3a. <异常条件>：系统…（Fail-Safe 行为）；用户感知：…（无则填"无"）

  **业务规则**
  - BR-1：…

  **追溯**
  - 来源：PRD <章节号> <L3 功能名称>

  （UC-02 … 依次展开）

  ## 3. 待确认项
  - [ ] …
