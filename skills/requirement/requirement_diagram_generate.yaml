name: requirement_diagram_generate
display_name: 子系统需求图生成（分配结果 → 需求图）
description: 基于 FR 子系统分配结果生成 Mermaid 原生需求图（requirementDiagram，SysML v1.6 风格），以树形包容结构表达功能需求→子系统的主责分配（contains）、协作关系（traces），并附追溯清单与完整性校验。
version: 1.1.0
risk_level: low
domain:
  - 需求工程
  - 系统架构
tags:
  - 需求图
  - requirementDiagram
  - SysML
  - 追溯
  - Mermaid
  - 子系统
  - 系统架构

model_hint:
  reasoning: enabled

required_any:
  - [assignment_content, file_id]

inputs:
  assignment_content:
    type: string
    required: false
    desc: 子系统分配矩阵正文（Markdown，ss_assignment_generate 的输出或既有分配文档）
  file_id:
    type: string
    required: false
    desc: 通过 /agent/files/upload 上传的分配文件 file_id；平台自动读取为 Markdown
  diagram_level:
    type: string
    required: false
    desc: 图粒度：subsystem（按子系统聚合，默认）/ detail（展开每条 FR 节点）；未提供按 subsystem

document_source:
  file_id_input: file_id

system_prompt: |
  你是资深系统架构师，精通需求追溯与架构建模。
  你的任务是把功能需求—子系统分配结果转化为一张结构正确、可直接渲染的 Mermaid 原生需求图
  （requirementDiagram 语法，SysML v1.6 风格：带 «requirement» 分舱需求节点与树形包容结构），
  直观表达需求分配与子系统协作。只输出 Markdown 正文（含 Mermaid 代码块）。

output:
  format: markdown

prompt_template: |
  请基于以下需求分配结果生成子系统需求图。

  【分配矩阵】：{{assignment_content}}
  【图粒度】：{{diagram_level}}

  若消息末尾附有文档段落（分配文件内容），以其为主要输入。

  # 绘图规则
  1. 使用 Mermaid 原生 **requirementDiagram** 语法（SysML v1.6 需求图，禁止用 flowchart 模拟）。
  2. 节点建模：
     - 子系统：element 节点，形如 `element "SS-038 感知融合和定位系统" { type: "子系统" }`；
       名称以子系统编号开头、后接中文系统名；
     - 功能需求：requirement 节点，形如
       `requirement "Fr-301-01-006" { id: "Fr-301-01-006" text: "…" }`；
       名称与 id 均用 FR 编号，text 为需求描述；矩阵中的状态（如 [pending]）、ASIL 等级追加在 text 开头；
     - risk 仅接受 Low/Medium/High；verifymethod 仅接受 Analysis/Inspection/Test/Demonstration；
       分配矩阵未明确给出时一律省略这两个字段，不得臆造；
     - 名称、id、text 一律用双引号包裹；字符串内禁止出现英文双引号。
  3. 关系表达（构成自上而下的树，默认布局即树形，不要写 direction）：
     - 主责分配：`"子系统名称" - contains -> "FR名称"`；
     - 协作关系：`"子系统A" - traces -> "子系统B"`，方向与分配矩阵一致；
     - 接口依赖不画边，写入追溯清单的"接口依赖"列；
     - 关系类型只允许 contains/copies/derives/satisfies/verifies/refines/traces 七种；
       禁止使用 flowchart 的箭头语法（-->、-.->、==>、|标签|）。
  4. 粒度策略：
     - subsystem（默认）：以子系统为父节点聚合其承接的全部 FR；子系统之间仅画 traces 协作边；
     - detail：每条 FR 一个节点并连到主责子系统；FR 超过 20 条时按子系统拆成多个 mermaid 代码块。
  5. 只绘制分配矩阵中存在的元素与关系；不得臆造子系统或接口。
  6. 名称全图唯一；同一 FR 只能作为一个子系统的 contains 子节点（主责唯一）。

  # 输出结构
  ## 1. 子系统需求图
  ```mermaid
  requirementDiagram

  element "SS-038 感知融合和定位系统" {
      type: "子系统"
  }

  requirement "Fr-301-01-006" {
      id: "Fr-301-01-006"
      text: "[pending][ASIL-B] 需车外传感器提供摄像头状态信息"
  }

  requirement "Fr-301-01-003" {
      id: "Fr-301-01-003"
      text: "[pending] 需感知融合与定位系统提供摄像头的图像数据"
  }

  "SS-038 感知融合和定位系统" - contains -> "Fr-301-01-006"
  "SS-038 感知融合和定位系统" - contains -> "Fr-301-01-003"
  ```

  ## 2. 需求-子系统追溯清单
  | 需求 ID | 主责子系统 | 协作子系统 | 接口依赖 | 图中表达 |
  |---|---|---|---|---|

  ## 3. 完整性校验
  - [ ] 分配矩阵中每条 FR 均在图中出现（共 X 条）
  - [ ] 每个子系统至少承接一条需求
  - [ ] 所有协作边均可在分配矩阵中找到依据
  - [ ] 状态与 ASIL 标注与分配矩阵一致
