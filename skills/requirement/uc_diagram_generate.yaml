name: uc_diagram_generate
display_name: 用例图生成（UC → 用例图）
description: 基于已确认用例规格生成 Mermaid 用例图，表达参与者、系统边界、用例以及 include/extend/泛化关系。
version: 1.0.0
risk_level: low
domain:
  - 需求工程
  - 系统分析
tags:
  - 用例图
  - Mermaid
  - UML
  - Use Case
  - 需求工程

model_hint:
  reasoning: enabled

# 后端 API 调用（scene=FROM_UC_CREATE_UC_DIAGRAM）不传 inputs，
# 已确认 UC 列表在 reference_data.uc_list 中。
inputs:
  system_name:
    type: string
    required: false
    desc: 系统边界名称（图中系统框标题）；未提供时从用例内容推断

system_prompt: |
  你是资深系统分析工程师，精通 UML 用例图建模。
  你的任务是把用例规格转化为一张结构正确、可直接渲染的 Mermaid 用例图。
  只输出 JSON 对象，不要附加任何解释性文字、Markdown 围栏或代码块标记。

output:
  format: json
  max_tokens: 8192
  schema:
    type: object
    required: [diagram_format, diagram_code]
    properties:
      diagram_format:
        type: string
        enum: [mermaid]
      diagram_code:
        type: string

prompt_template: |
  请基于参考数据中的已确认用例列表（reference_data.uc_list）生成用例图（Use Case Diagram）。

  # 输入来源
  用例规格在本消息末尾的【参考数据】段落中，字段名为 uc_list，是一个数组；
  每个元素的 content 字段包含完整 UC（name、actors、scenario 等），number 字段为用例编号。
  请以这些已确认 UC 为唯一事实来源，不新增规格之外的用例。

  # 绘图规则
  1. 使用 Mermaid flowchart LR 语法绘制（确保主流渲染器兼容；不要使用实验性 usecaseDiagram）。
  2. 布局约定：
     - 参与者（Actor）放在系统边界外侧：左侧放主参与者，右侧放次要/外部系统参与者；
       参与者节点用普通矩形表示，节点 ID 以 actor_ 开头。
     - 系统边界用 subgraph SYS["<系统名称>"] 表达；系统名称从用例内容推断，无法推断用"目标系统"。
     - 用例节点使用圆角括号形状 UC01(["用例名称"])，节点 ID 与用例编号对齐（UC-01 → UC01）。
  3. 关系表达：
     - 关联（参与者—用例）：实线无箭头 ---；
     - 包含 <<include>>：-.->|include|，箭头由基础用例指向被包含用例；
     - 扩展 <<extend>>：-.->|extend|，箭头由扩展用例指向基础用例；
     - 泛化：--> 并在关系标签注明 generalize（谨慎使用，仅在规格明确存在时绘制）。
  4. 仅绘制规格中真实存在的参与者、用例与关系；不得新增规格之外的用例。
  5. 若用例数量超过 15 个，按功能模块拆成多张图（用 %% 注释分隔），避免单图不可读。
  6. Mermaid 节点标签禁止使用未转义的双引号、括号冲突；中文标签直接书写。

  # 输出格式
  严格输出如下 JSON 结构（不要输出任何其他文字）：
  {
    "diagram_format": "mermaid",
    "diagram_code": "flowchart LR\n  actor_driver[\"驾驶员\"]\n  subgraph SYS[\"目标系统\"]\n    UC01([\"用例名称\"])\n  end\n  actor_driver --- UC01"
  }
