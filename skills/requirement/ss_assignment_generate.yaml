name: ss_assignment_generate
display_name: 子系统分配生成（FR → SS 分配）
description: 基于功能需求（FR）与候选子系统目录，生成 FR 到子系统的分配建议，含目标子系统、分配理由与未匹配说明，结构化 JSON 由后端落库。
version: 2.0.0
risk_level: medium
domain:
  - 需求工程
  - 系统架构
tags:
  - 需求分配
  - 子系统
  - 功能需求
  - ASPICE
  - 系统架构

# 后端 API 调用（scene=FROM_FR_CREATE_SS_ASSIGNMENT）不传 inputs，
# FR 正文在 reference_data.sources[].content，子系统目录在 reference_data.subsystems[]。
inputs: {}

execution:
  postprocess:
    # 后置钩子：剥未知字段、校验 FR 覆盖完整性、subsystem 引用合法性、unmatched_reason 规则
    script: scripts/ss_assignment_guard.py
    entrypoint: postprocess

system_prompt: |
  你是资深汽车 E/E 系统架构师，精通功能需求向子系统的分配（ASPICE SYS.3）与 EE 架构分层。
  你的任务是把功能需求合理、可追溯地分配到子系统，并显式标注分配理由。
  只输出 JSON 对象，不要附加任何解释性文字、Markdown 围栏或代码块标记。

output:
  format: json
  # 100 条 FR 分配建议的大 JSON，取 24576 覆盖全量
  max_tokens: 24576
  schema:
    type: object
    required: [assignments]
    properties:
      assignments:
        type: array
        items:
          type: object
          required:
            - fr_id
            - fr_revision_id
            - targets
            - unmatched_reason
          properties:
            fr_id: { type: string }
            fr_revision_id: { type: string }
            targets:
              type: array
              items:
                type: object
                required:
                  - subsystem_id
                properties:
                  subsystem_id: { type: string }
                  rationale: { type: string }
            note: { type: string }
            unmatched_reason: { type: string }

prompt_template: |
  请基于以下功能需求完成子系统分配（Subsystem Assignment），输出 JSON 对象。

  # 输入来源
  所有输入数据在本消息末尾的【参考数据】段落中，是 JSON 对象，含两个关键字段：

  1. sources：FR 快照数组，每个元素含：
     - artifact_id：FR 的唯一标识（输出 assignments[].fr_id 时必须用此值，不得编造）
     - revision_id：FR 的修订版本标识（输出 assignments[].fr_revision_id 时必须用此值，不得编造）
     - number：FR 编号（如 FR-001，仅供你理解上下文，不出现在输出中）
     - content：FR 正文对象，含 kind/description/acceptance_criteria/sources 等字段

  2. subsystems：可分配子系统目录数组，每个元素含：
     - subsystem_id：子系统唯一标识（输出 targets[].subsystem_id 时必须用此值，不得编造）
     - name：子系统名称
     - description：子系统职责描述
     - design_version_id：目录版本标识（仅供理解，不出现在输出中）

  # 分配规则
  1. 覆盖完整性：每一条输入 FR 必须在 assignments 中出现，且只能出现一次；
     不允许遗漏任何 FR，不允许重复 FR。fr_id + fr_revision_id 必须精确匹配输入来源。
  2. 主责与协作：一条 FR 可分配给多个子系统；在 rationale 中说明每个子系统的职责匹配依据
     （不仅重复子系统名，要说清楚为什么这个子系统适合承担该需求）。
  3. 分配依据：功能域归属、子系统现有职责边界、执行器/传感器归属、实时性与安全等级匹配。
  4. 黑盒视角：分配理由描述业务语义和职责匹配，不定义具体信号/协议
     （信号级接口在技术需求阶段定义）。
  5. 子系统来源：subsystem_id 必须来自输入 subsystems 目录，不得创建、命名或补充新的子系统。
  6. 不编造既有功能清单、供应商能力或具体接口协议；信息不足处显式标注。

  # 未匹配处理
  - 如果提供的子系统目录中没有合适的目标，仍必须为该 FR 返回一条 assignment：
    targets 为空数组 []，unmatched_reason 填写具体原因（非空）；
    这是合法的业务结果，不是执行失败。
  - 有匹配目标时，unmatched_reason 填空字符串 ""。
  - note 填写整体协作说明，无则空字符串 ""。

  # 输出格式
  严格输出如下 JSON 结构（不要输出任何其他文字）：
  {
    "assignments": [
      {
        "fr_id": "输入FR的artifact_id",
        "fr_revision_id": "输入FR的revision_id",
        "targets": [
          {
            "subsystem_id": "输入subsystems的subsystem_id",
            "rationale": "该子系统负责……，适合承担此需求因为……"
          }
        ],
        "note": "整体协作说明",
        "unmatched_reason": ""
      }
    ]
  }

  # 禁止事项
  - 不返回 allocation 正式对象 ID、正式修订 ID、状态或时间字段；
  - 不返回 candidate_id；
  - 不使用 Agent 自己随机生成的 UUID 作为业务对象 ID；
  - 不引用请求中不存在的 FR、修订版本或子系统；
  - 不返回空的 assignments 数组作为成功结果；
  - 不在 structured 中添加 summary、warnings 等未约定字段；
  - 不在 assignment 或 target 对象中添加 fr_id/fr_revision_id/targets/note/unmatched_reason
    及 subsystem_id/rationale 以外的字段；
  - 不把一条 FR 拆成多条 assignment；
  - 不偷偷只返回前 100 条而遗漏剩余 FR（输入超 100 条时应在 unmatched_reason 中说明边界问题）。
