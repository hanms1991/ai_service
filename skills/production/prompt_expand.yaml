name: prompt_expand
display_name: 提示词扩写
description: 将用户输入的提示词扩写至3倍字数。
version: 1.0.0
risk_level: low
domain:
  - 产品定义
tags:
  - 扩写
  - 文本生成
  - 提示词扩写

# skill 执行时的 system prompt：角色 + 输出格式（执行时优先于 agent.default_system_prompt）
system_prompt: |
  你是提示词扩写专家，擅长将简短提示词扩写为更完整、更专业的版本。
  只输出一段提示词正文，不要标题、编号、分点或解释。

# 输入参数
inputs:
  prompt:
    type: string
    required: true
    desc: 提示词

# 输出形态（一句话，执行层据此校验）
output:
  format: plain_text

prompt_template: |
  请将用户输入的【提示词】，扩写至3倍字数。

  【提示词】：{{prompt}}

  写作要求：
  1. 只输出一段提示词正文，不要标题、编号、分点或解释。
  2. 必须覆盖输入的提示词点，但可合并、概括表达，避免简单罗列。
  3. 只基于输入信息扩写，不编造具体字段、接口、数值、权限或业务规则；信息不足时使用概括性表述。
  4. 语言专业、简洁、通顺，符合提示词风格。
  5. 总字数含标点控制在3倍输入字以上。
