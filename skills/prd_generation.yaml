name: prd_generation
display_name: 汽车功能 PRD 生成
description: 根据功能名称生成完整汽车功能 PRD 文档（Markdown）。
version: 1.0.0
risk_level: low
domain:
  - 产品定义
tags:
  - PRD
  - 汽车
  - 需求文档
  - 文本生成
  - 产品定义

system_prompt: |
  你是汽车电子电气架构（EEA）领域的资深产品需求文档（PRD）撰写专家。
  严格按照用户提供的 PRD 模板、编写规则和校验清单，生成完整 Markdown 格式的汽车功能 PRD。
  只输出 PRD 文档正文，不要附加生成说明、元信息或解释。
  所有规则均为强约束，违反任何一条视为生成不通过。

inputs:
  feature_name:
    type: string
    required: true
    desc: 本次 PRD 对应的具体汽车功能名称，如“位置灯”“驾驶模式控制”“儿童锁控制”
  project:
    type: string
    required: false
    desc: 功能所属项目/平台，如具体车型项目代号，或“通用”
  version:
    type: string
    required: false
    desc: 文档版本，默认 V1.0

output:
  format: markdown

prompt_template: |
  请根据以下输入生成一份完整的汽车功能 PRD 文档（Markdown 格式）。
  【功能名称】：{{feature_name}}
  【适用项目】：{{project}}
  【版本号】：{{version}}

  以下为 PRD 的完整 8 章节结构。每个章节均包含【模板格式】和【编写规则】两部分，生成时必须同时遵守。

  ### 文档属性（文首必填）
  | 属性 | 内容 |
  |------|------|
  | 文档名称 | {{feature_name}}功能PRD_V{{version}} |
  | 版本 | V{{version}} |
  | 适用项目 | {{project}} |
  | 产品负责人 | {待填写} |
  | 创建日期 | {TODAY} |

  ### 目录结构
  1. 文档说明
  2. 需求背景
  3. 需求描述
  4. 功能详细说明
  5. 验收指标
  6. 埋点要求
  7. 项目规划
  8. 附录

  ## 第 1 章 文档说明
  ### 1.1 概述
  【模板格式】
  本文档定义{功能名称}的产品需求，包括功能范围、用户场景、功能需求、验收标准等内容，作为研发、测试、设计的参考依据。
  【编写规则 — A1 概述】
  - 必须用一句话讲清楚：功能名称 + 需求范围 + 受众。
  - 需求范围应覆盖：功能范围 + 用户场景 + 功能需求 + 验收标准。
  - 受众为：研发、测试、设计等下游协作方。
  - 禁止“本文档介绍了一个功能”“本 PRD 描述了汽车上的一些需求”等无信息量表述。

  ### 1.2 变更日志
  【模板格式】
  | 版本 | 日期 | 修改人 | 变更内容 |
  |------|------|--------|----------|
  | V{版本号} | {TODAY} | {待填写} | 初始版本 |
  【编写规则 — A2 变更日志】
  - 四要素缺一不可：时间（统一用 {TODAY} 占位符）、版本号、变更人、变更内容（必须具体到章节）。
  - 按时间倒序排列（最新变更在上）。
  - 新建文档必须包含一行基线版本记录。
  - 禁止“更新了部分内容”“修订了若干章节”等笼统表述。
  - 禁止只写“初始版本”而不写创建人。

  ### 1.3 术语表
  【模板格式】
  | 术语 | 定义 |
  |------|------|
  | {术语1} | {定义} |
  | {术语2} | {定义} |
  【编写规则 — A3 术语表】
  - 文档中每出现一次专业术语/缩略词/专有名词/行业黑话，第一次出现时必须在术语表中有定义。
  - 覆盖英文缩略词、产品内部专有名词、行业黑话/业务术语、法规标准代号前缀。
  - 每条术语三要素：缩略词/术语全称、中文释义、英文全称（可选）。
  - 按字母/缩略词/中文拼音顺序统一排序。
  - 禁止纳入“用户”“车辆”“系统”等常见通用术语。
  - 同一术语只在术语表中定义一次。

  ### 1.4 参考文档
  【模板格式】
  | 文档名称 | 版本/日期 | 说明 |
  |----------|-----------|------|
  | {文档1} | {版本} | {说明} |
  | {文档2} | {版本} | {说明} |
  【编写规则 — A4 参考文档】
  - 四要素缺一不可：文档名称、版本号/发布日期、文档类型、来源/链接。
  - 覆盖三类：上级/关联 PRD/FDR、法规标准、参考资料/调研材料。
  - 所有链接必须经过验证可访问，无效链接需明确标注“链接已失效/待补充”。
  - 禁止只写“参考相关法规标准”“见附件”“内部资料”等无法追溯的笼统表述。

  ## 第 2 章 需求背景
  ### 2.1 产品价值/目的
  【模板格式】
  {核心价值概述}
  【编写规则 — B1 产品价值】
  - 站在用户视角回答：这个功能为什么值得做、解决了什么用户的什么问题、带来什么可感知的价值。
  - 必须具体到可识别的颗粒度。
  - 建议按“用户痛点 + 解决方案 + 价值收益”三段组织。
  - 禁止“提升用户体验”“本功能很有用”“体验良好”等无信息量表述。

  ### 2.2 数据现状
  【模板格式】
  | 指标项 | 数据 | 来源 |
  |--------|------|------|
  | {指标1} | {数值} | {数据来源} |
  【编写规则 — B2 数据现状】
  - 核心原则：必须联网搜索 + 来源可追溯，禁止凭印象/记忆/听说捏造数据；信息不确定时必须主动告知用户。
  - 强相关 vs 基础功能边界：只对与用户体验强相关的功能强制要求；基础功能直接写“本功能为基础功能，不涉及数据现状分析”。
  - 数据种类应服务于功能价值论证：市场渗透率、安全效果数据、用户使用率/接受度、行业趋势数据。
  - 查询渠道优先：中汽中心、乘联会、中汽协、艾瑞咨询、IDC China、S&P Global Mobility、JATO Dynamics、麦肯锡汽车行业报告等。
  - 每条数据必须标注三要素：数据值 + 统计周期 + 数据来源。
  - 所有数据必须给出明确统计周期，禁止“近年来”或“目前”。
  - 超过 2 年的旧数据原则上不引用，且必须标注“数据较旧”。
  - 联网搜索后仍无法找到的数据，不编造、不臆造、不估一个看似合理的数字，主动告知用户。

  ### 2.3 用户调研
  #### 2.3.1 用户画像
  【模板格式】
  | 维度 | 描述 |
  |------|------|
  | 目标用户 | {描述} |
  | 使用频率 | {高频/中频/低频} |
  | 技能水平 | {新手/普通/专家} |
  【编写规则 — B3 用户调研（段一：用户画像）】
  - 三要素缺一不可：目标用户、使用频率、技能水平。
  - 目标用户必须具体到可识别颗粒度，不能笼统写“驾驶员”。
  - 使用频率必须明确给出，禁止“看情况”或“待定”。
  - 技能水平：新手/普通/专家。

  #### 2.3.2 用户痛点
  【模板格式】
  | 痛点编号 | 痛点描述 | 严重程度 |
  |----------|----------|----------|
  | 01 | {痛点描述} | {高/中/低} |
  【编写规则 — B3 用户调研（段二：用户痛点）】
  - 每条痛点三要素：痛点编号、痛点描述、严重程度。
  - 痛点描述必须是用户视角的可感知问题。
  - 禁止工程师视角的实现难点。
  - 禁止“用户体验差”“功能不完善”等笼统表述。

  #### 2.3.3 用户访谈/调研结论
  【模板格式】
  {用户访谈的结论、调研数据}
  【编写规则 — B3 用户调研（段三：调研结论）】
  - 当且仅当有真实调研数据时填写。
  - 明确写出：调研样本量、调研方式、关键发现、对应到本功能的设计启示。
  - 建议呈现形式为“调研发现 → 对本功能的设计启示”两栏对照。
  - 如果尚未开展调研，直接标注“待补充”，禁止编造或臆造调研结论。

  ### 2.4 竞品分析
  【模板格式】
  | 竞品 | 功能配置 | 实现方式 | 差异化点 |
  |------|----------|----------|----------|
  | {竞品1} | {配置描述} | {实现方式} | {差异化} |
  | {竞品2} | {配置描述} | {实现方式} | {差异化} |
  【编写规则 — B4 竞品分析】
  - 核心原则：必须基于联网搜索获取的公开可查资料，禁止凭记忆/印象/听说编写；信息不确定时必须主动告知用户。
  - 竞品选择要合理：选取 2~4 款竞品，覆盖直接竞品、间接竞品、创新标杆。
  - 对比维度要固定：功能名称/是否支持/实现方式/触发条件/用户交互形式/差异化亮点/借鉴启示；所有竞品按同一套维度填写。
  - 每条竞品信息后用括号标注来源，保留搜索链接供回溯。
  - 必须落到“借鉴 + 差异化”启示，禁止只对比不结论。
  - 联网搜索后仍无法确认的信息，不编造、不臆造、不猜一个，主动告知用户。

  ### 2.5 法规&国标约束
  【模板格式】
  | 法规名称 | 版本/实施日期 | 相关要求 |
  |----------|-------------|---------|
  | {法规名称1} | {版本和实施日期} | {法规条款} |
  | {法规名称2} | {版本和实施日期} | {法规条款} |
  【编写规则 — B5 法规国标】
  - 核心原则：必须基于联网搜索获取的现行有效标准文本，禁止凭记忆引用过期标准号、错误条款号或捏造要求；信息不确定时必须主动告知用户。
  - 查询渠道优先：国家标准全文公开系统、全国标准信息公共服务平台、对应行业标准的归口部委官网；其次选权威媒体或标准服务平台的二手解读。
  - 每条法规引用必须标注四要素：标准号 + 标准名称 + 发布年份 + 实施年份。
  - 必须落到本功能的具体要求：每条法规项下补充一段“该标准对本功能的具体要求”。
  - 覆盖三类标准：强制性国家标准（GB）、推荐性国家标准（GB/T）、行业标准 + 企业内部标准（如有）。
  - 每条法规下应明确标注合规影响：强约束/应满足/参考。
  - 联网搜索后仍无法确认的标准号/条款号/具体要求，不编造、不臆造、不凭印象写一个看似合理的标准号，主动告知用户。
  - 标准号写错是最严重的失实，关系到合规风险，零容忍。

  ## 第 3 章 需求描述
  ### 3.1 应用场景
  【模板格式】
  {功能应用场景整体概述}
  用户故事：
  > 作为一个 [用户角色]，
  > 我希望 [完成某个操作]，
  > 以便 [达到某个目的]
  | 场景编号 | 场景描述 |
  |---------|----------|
  | 场景1 | {场景1描述} |
  | 场景2 | {场景2描述} |
  【编写规则 — C1 应用场景】
  - 核心原则：始终站在用户视角，分别从驾驶员、乘客、行人等所有可感知该功能的主体出发。
  - 三段式组织顺序（强制要求）：
    段一：整体场景概述。先用一段话写清“本功能的整体使用场景”。
    段二：用户故事（User Story）（强制要求）。每个功能的应用场景必须以用户故事形式描述，格式：作为一个 [用户角色]，我希望 [完成某个操作]，以便 [达到某个目的]。
    段三：场景展开表格（强制要求两列格式）。用两列表格展开子场景，禁止使用三列及以上。列 1：场景编号；列 2：场景描述（用户身份 + 场景 + 痛点 + 解决方案）。
  - 每个应用场景四要素：用户身份、使用场景、痛点/需求、本功能如何解决。
  - 禁止“提升用户体验”“解决用户痛点”等无具体场景的笼统表述；禁止工程师视角的实现难点。

  ### 3.2 功能定义
  【模板格式】
  功能概述：
  {功能是什么、有什么用户价值}
  功能运行简介：
  {使用功能的完整工作流程，按 1→2→3→… 步骤}
  【编写规则 — C2 功能定义】
  - 两段式结构：
    段一：功能概述。和 3.1 应用场景一脉相承，站在用户视角，用一句话讲清楚“这个功能给用户带来什么价值”。必须与第 4 章“功能描述”保持一致。禁止写技术实现概要。不涉及具体执行逻辑。
    段二：功能运行简介。相当于“本功能使用说明书”，按“1→2→3→…”的步骤清晰写出用户使用本功能的操作流程。每一步必须可操作、可感知。关键步骤注明“注意事项”。必须配“操作参考图”（流程图、UI 截图、用户动线图）——如无法生成图片，用文字详细描述图中内容。每张图都要能直接回答“用户此刻在做什么/屏幕显示了什么/听到/看到/触碰到什么”。

  ### 3.3 功能列表
  【模板格式】
  | L1功能 | L2功能 | L3功能 | 功能描述 | 优先级 |
  |------|-------------|--------------|----------|--------|
  | {L1功能名称} | {L2功能名称} | {L3功能名称} | {L3功能描述} | P0 |
  【编写规则 — C3 功能列表】
  - 核心原则：每个功能都必须按 L1 → L2 → L3 三层结构组织。
  - 功能列表必须为 5 列表格：L1功能 | L2功能 | L3功能 | 功能描述 | 优先级，禁止增减列。
  - L1 功能：整车功能模块的顶层分类，一份 PRD 通常只对应一个 L1。优先从知识库中检索对应的 L1 功能；知识库未收录则新增 L1 需明确标注“新增 L1：XX”。
  - L2 功能：L1 下的具体功能模块，是撰写 PRD 的基本单元。
  - L3 功能：L2 的进一步细化，挖掘智能化、自动化、体验好的功能点。L3 是“最小功能点”层级，第 4 章中的每个基本事件对应一个 L3。
  - L3 挖掘的 8 个“必查清单”维度（至少覆盖 3~5 个）：场景痛点、预设预判、能耗优化、多源融合、跨域联动、自动复原、习惯学习、远程控制。
  - 优先级定义：P0 基础必备；P1 亮点功能；P2 锦上添花；P3 低优先级。每个 L3 必须标注，禁止“全部 P0”或“待定”。

  ### 3.4 用户体验要求
  【模板格式】
  | 维度 | 要求描述 |
  |------|------|
  | 好用 | {要求描述} |
  | 好灵 | {要求描述} |
  | 好看 | {要求描述} |
  | 好炫 | {要求描述} |
  【编写规则 — C4 用户体验要求】
  - 核心原则：四个维度必须全部覆盖，每个维度都要明确给出“可被验收的设计指标”，缺一不可。
  - 撰写顺序：好用 → 好灵 → 好看 → 好炫。
  - 好用：核心操作步骤 ≤ 3 步、关键操作有引导动画、误操作有撤销入口、新手用户 30 秒可独立完成首次操作。禁止“操作便捷”等无法验证的笼统表述。
  - 好灵：交互响应延迟 ≤ 100ms、系统主动识别用户意图、根据用户历史偏好预判下一步。禁止“响应及时”或“智能”等无具体数值的空话。
  - 好看：界面元素遵循《整车 HMI 设计规范》、色彩对比度满足 WCAG 2.1 AA 级标准、动效时长统一在 200~400ms 区间、关键状态切换有 1~2 个交互动效。禁止“界面美观”或“设计合理”等无法对标的表述。
  - 好炫：至少 1 个差异化亮点、关键场景有专属动效或音效、重要操作有微动效/微震感/语音播报等多模态反馈。禁止“具有科技感”或“创新性强”等无具体场景的虚话。

  ## 第 4 章 功能详细说明
  本章为 PRD 核心章节，每个 L3 功能点对应一个 4.x 小节，严格按照 6 要素模板撰写。
  ### 4.x {L3 功能名称}
  【模板格式】
  | 功能描述 | {详细描述} |
  |------|------|
  | 前置条件 | {功能触发前必须满足的条件} |
  | 触发条件 | {功能触发的条件} |
  | 基本事件 | 1. {条件判断} |
  |  | 2. {系统动作} |
  |  | 3. {用户结果} |
  | 异常事件 | 1. {异常情况} → {用户可感知的结果} |
  |  | 2. {异常情况} → {用户可感知的结果} |
  | 用户交互示意 | {HMI/APP 交互描述或者图形界面} |
  【编写规则 — D1 6 要素模板】
  - 核心原则：必须站在用户视角描述功能，禁止暴露任何工程实现细节。
  - 6 要素缺一不可：功能描述、前置条件、触发条件、基本事件、异常事件、用户交互示意。
  - 必填字段完整性：所有必填字段均必须填写，无关键信息缺失。确实不涉及的字段，统一标注“N/A”，禁止留空或写“待补充”“待定”等模糊措辞。写“待补充”必须同时注明“待补充原因 + 预计补充时间 + 责任人”。
  - UC 用例独立性：UC（Use Case）用例必须独立成文档，不在 PRD 中编写。PRD 中只描述“该功能是什么、用户怎么用、边界如何处理”，不展开“完整用例流”。

  【编写规则 — D2 词汇层红线（所有章节通用）】
  - 目的：PRD 中禁止出现工程实现细节，因为用户不关心这些。
  - 四类禁词清单：
    通讯网络类：CAN、LIN、以太网、通讯协议、协议层、通讯超时。
    控制器硬件类：域控制器、BCM、VCU、锁机电机、电机驱动、控制器、CCU、仪表。
    传感器/执行器/IO 类：传感器、执行器、IO 口、信号检测、硬线采集、CAN 发送。
    信号/状态/检测类：检测到、信号正常、信号异常、状态检测、信号处理、状态值、锁止状态。
  - 改写规则：
    XX 信号异常 / XX 传感器故障 → 无法判断 XX 时。
    通讯超时 → 操作超时，请重试。
    通过 XX 控制器 / XX 电机执行 → 系统自动执行 / 车辆自动 XX。
    检测到安全带未系，发送报警信号 → 驾驶员未系安全带时，车辆发出未系安全带提醒。
  - 口诀：“用户不知道的，就是不能写的。”

  【编写规则 — D3 基本事件撰写规则（4 步法）】
  - 核心原则：动作与结果分离。
  - 4 步法组织顺序：条件判断 → 系统动作 → 用户结果 → 状态恢复。
  - 避免三类典型错误：动作结果混合、用状态描述代替用户结果、暴露工程实现细节。
  - 事件流描述应该做什么，而不是怎么做。

  【编写规则 — D4 异常事件撰写规则（用户视角 + Fail-Safe）】
  - 三条原则：
    原则一：用户视角。只描述用户能感知到的现象，禁止暴露内部状态。所有“信号异常/传感器故障/通讯中断”等内部诊断结论，都必须改写为“无法判断 XX 时”。
    原则二：保守策略（Fail-Safe）。当系统无法判断某个安全相关条件时，默认行为必须是“保持最安全的状态”。
    原则三：零工程细节。禁止出现检测、传感器、信号、ECU、通讯、协议、IO、控制器、执行器、状态检测、信号处理等任何工程词汇。面向用户的提示文案直接写“提示用户：XX”。
  - 异常事件四要素：触发条件、系统默认行为、用户感知结果、兜底提示。

  【编写规则 — D5 用户交互示意规范】
  - 必须配有清晰的操作参考图（流程图、UI 截图、用户动线图）——如无法生成图片，用文字详细描述图中内容。
  - 每一张图都要能直接回答“用户此刻在做什么/屏幕/仪表/提示音显示了什么”，而不是内部状态切换。
  - 配图缺失或示意图只画了系统内部状态不画用户可见效果的，视为不通过。

  ## 第 5 章 验收指标
  ### 5.1 主观指标
  【模板格式】
  | 验收项 | 验收标准 | 测试方法 |
  |--------|----------|----------|
  | {验收项1} | {标准描述} | {测试方法} |
  【编写规则 — E1 主观验收】
  - 关注用户主观感受类指标。
  - 两要素：验收内容 + 测试方法。
  - 典型示例：“操作流畅度：采用 5 分制满意度评分，由 10 名用户实际操作后打分”“提示信息清晰度：采用眼动仪+用户访谈，记录用户是否在 3 秒内理解提示含义”。
  - 禁止“用户满意”“体验良好”等无法测试的笼统表述。

  ### 5.2 客观指标
  【模板格式】
  | 指标 | 标准值 | 说明 |
  |------|--------|------|
  | {指标1} | {标准值} | {说明} |
  【编写规则 — E2 客观验收】
  - 关注可量化、可自动采集的指标。
  - 三要素：指标名称 + 标准值 + 说明。
  - 典型示例：“响应时间 ≤ 200ms：从用户触发操作到系统给出反馈的时间，测试方法为示波器抓取信号+打点日志”“成功率 ≥ 99.9%：连续 10000 次操作中成功次数占比，测试方法为自动化脚本压测”。
  - 禁止“性能达标”“运行稳定”等无标准值的空话。

  ## 第 6 章 埋点要求
  【模板格式】
  | 事件ID | 事件名称 | 触发条件 | 上报字段 | 上报时机 |
  |--------|----------|----------|----------|----------|
  | {事件ID} | {事件名称} | {触发条件} | {上报字段} | {上报时机} |
  【编写规则 — F 埋点要求】
  - 核心原则：只针对座舱类人机交互功能落地，一般功能可不写，直接标注“本功能为纯执行类功能，不涉及埋点要求”。
  - F1 埋点目的：开篇先写清“该埋点是为了分析用户使用该功能的频次、场景分布、转化漏斗或异常行为”。禁止“统计用户使用情况”这种无信息量的目的描述。
  - F2 埋点事件清单（五要素，每个事件缺一不可）：事件 ID、事件名称、触发条件、上报字段、上报时机。
  - F3 埋点位置约束：埋点位置必须在用户可感知的关键节点上——功能进入、功能退出、用户主动操作、异常分支触发。禁止在系统内部状态切换处打点。

  ## 第 7 章 项目规划
  【模板格式】
  注：待特定项目启动后填写。
  【编写规则 — G1 项目规划】
  - 待特定项目启动后填写——PRD 模板阶段可保留章节结构。
  - 项目启动后应包含：里程碑节点、责任分工、资源计划、风险识别与应对。
  - 禁止在项目未启动时编造具体的开发时间表。

  ## 第 8 章 附录
  【模板格式】
  注：待补充。
  【编写规则 — H1 附录】
  - 典型内容：术语详细定义、法规全文链接、竞品分析详细对比表、用户调研原始记录、内部评审意见与回复、修订历史、任何无法归入正文的支撑性材料。
  - 附录材料应与正文有明确的引用关系（正文中“详见附录 A”）。
  - 禁止把附录当成“凑字数”的回收站。
  - 待补充的内容应明确标注“待补充”，禁止编造。

  ## 五、全局强约束
  ### 约束 1：联网搜索硬约束（5 条）
  | 规则 | 核心约束 | 失实后果 |
  |------|---------|---------|
  | 数据现状（2.2） | 数据必须联网搜索 + 三要素（数据值+统计周期+来源）+ 不确定就告知 | 误导资源决策 |
  | 竞品分析（2.4） | 竞品信息必须联网搜索 + 不确定就告知 | 误导差异化策略 |
  | 法规国标（2.5） | 标准号必须联网搜索 + 四要素（标准号+名称+发布年+实施年）+ 不确定就告知 | 合规风险，零容忍 |
  | 功能定义（3.2） | 功能概述必须与 3.1 应用场景一脉相承 | PRD 内部矛盾 |
  | 功能列表（3.3） | L1/L2/L3 必须从知识库检索，避免凭印象 | 跨项目体系对不上 |

  ### 约束 2：词汇层红线（所有章节通用）
  - 严格遵守 D2 规则中的四类禁词清单和改写规则。
  - 口诀：“用户不知道的，就是不能写的。”
  - 生成完成后必须全文扫描禁词，发现立即改写。

  ### 约束 3：N/A 兜底规则
  - 所有必填字段必须填写。
  - 确实不涉及的字段统一标注 “N/A”。
  - 禁止留空或写“待补充”“待定”等模糊措辞。
  - 写“待补充”必须同时注明“待补充原因 + 预计补充时间 + 责任人”。

  ### 约束 4：UC 用例独立性
  - UC（Use Case）用例必须独立成文档，不在 PRD 中编写。
  - PRD 中只描述“该功能是什么、用户怎么用、边界如何处理”。

  ### 约束 5：不确定就告知，绝不杜撰
  - 适用于所有需要外部事实的章节（数据、竞品、法规、调研等）。
  - 联网搜索后仍无法确认的信息，不编造、不臆造、不猜一个看似合理的。
  - 主动告知用户具体不确定点和未找到的原因。
  - 诚实优于体面。

  ## 六、输出要求
  1. 格式：完整的 Markdown 格式，包含文档属性表、8 个一级章节、各章节下的子章节和表格。
  2. 完整性：8 个章节必须全部出现，不得省略任何章节；项目规划和附录如无内容可保留“待填写/待补充”标注。
  3. 占位符处理：
     - 已知信息直接填写（功能名称、适用项目、版本号等）。
     - 日期统一用 {TODAY} 占位符（创建日期、变更日志日期等），后端会自动替换为当前日期，禁止自行编造日期。
     - 需用户补充的个人信息（如产品负责人、修改人）标注“{待填写}”。
     - 需调研但未获取的数据标注“待补充”并说明原因。
     - 确实不涉及的字段标注“N/A”。
  4. 一致性：
     - 3.2 功能概述必须与 3.1 应用场景一脉相承。
     - 4.x 功能描述必须与 3.3 中的 L3 功能一致。
     - 全文术语使用必须与 1.3 术语表一致。
  5. 不要在文末附加“生成说明”：文档以第 8 章附录结尾即可，禁止在附录之后追加任何“生成说明”“本次生成覆盖了哪些章节”等元信息。

  ## 七、完整自我校验清单
  生成完成后，必须逐项核对以下清单。任何一条答“否”，都必须改写后才能交付。
  ### A. 文档元信息
  - [ ] A1 概述：是否一句话讲清了功能名 + 范围 + 受众？
  - [ ] A2 变更日志：四要素（时间+版本+人+内容具体到章节）是否齐全？
  - [ ] A3 术语表：文档中所有首次出现的专业术语/缩略词是否都已定义？每条是否有本项目语境下的中文释义？
  - [ ] A4 参考文档：四要素（名称+版本+类型+来源）是否齐全？是否覆盖了上级 PRD/FDR + 法规标准 + 调研资料三类？
  ### B. 需求背景
  - [ ] B1 产品价值：是否站在用户视角、具体到可识别颗粒度？
  - [ ] B2 数据现状：每条数据是否都联网验证并标注三要素（值+周期+来源）？不确定的是否告知用户？基础功能是否正确标注“不涉及”？
  - [ ] B3 用户调研：用户画像是否具体到可识别颗粒度？痛点是否都是用户视角且标了严重程度？调研结论无真实数据时是否标注“待补充”？
  - [ ] B4 竞品分析：每条竞品信息是否联网验证并标注来源？是否按统一维度对比？是否落到“借鉴+差异化”启示？
  - [ ] B5 法规国标：每条法规是否联网验证并标注四要素？是否落到本功能具体要求？是否标注了合规影响？
  ### C. 需求描述
  - [ ] C1 应用场景：是否按“概述+用户故事+两列表格”三段式组织？用户故事格式是否正确？场景是否包含“身份+场景+痛点+解决”四要素？
  - [ ] C2 功能定义：概述是否站在用户视角且与 C1 一脉相承？运行简介是否按可操作步骤写清？
  - [ ] C3 功能列表：是否为 5 列表格？L1/L2/L3 三层是否齐全？L3 是否覆盖了 8 个维度的至少 3~5 个？每个 L3 是否标了 P0/P1/P2/P3？
  - [ ] C4 用户体验：好用/好灵/好看/好炫四维度是否全部覆盖？每个维度是否给出了可验收的设计指标？
  ### D. 功能详细说明
  - [ ] D1 6 要素：每个 L3 对应的 4.x 小节是否 6 要素齐全？不涉及的是否标了“N/A”？
  - [ ] D2 词汇红线：全文是否还残留 CAN/控制器/传感器/检测/信号/状态/锁止等禁词？
  - [ ] D3 基本事件：是否动作与结果分离？是否按 4 步法组织？是否零工程细节？
  - [ ] D4 异常事件：是否用户视角 + Fail-Safe + 零工程术语？是否包含四要素？
  - [ ] D5 用户交互示意：是否清晰展示了用户操作和每步显示效果？
  - [ ] UC 独立性：是否未在 PRD 中展开完整用例流？
  ### E. 验收指标
  - [ ] E1 主观验收：每项是否都有可执行的测试方法？
  - [ ] E2 客观验收：每项是否都有可量化的标准值？
  ### F. 埋点要求
  - [ ] F1：是否明确了埋点的业务价值？
  - [ ] F2：每个埋点事件五要素是否齐全？事件 ID 是否规范？
  - [ ] F3：埋点位置是否落在用户可感知节点上，而非系统内部状态？
  ### G. 项目规划 & 附录
  - [ ] G1：项目未启动时是否未编造具体开发时间表？
  - [ ] H1：附录内容是否与正文有引用关系？是否未编造？
  ### 全局
  - [ ] 8 个章节是否全部出现，无遗漏？
  - [ ] 全文是否无留空字段（N/A 或待补充标注除外）？
  - [ ] 3.2 功能概述与 3.1 应用场景是否一致？
  - [ ] 4.x 功能描述与 3.3 L3 功能是否一致？
  - [ ] 文末是否未附加“生成说明”等元信息？