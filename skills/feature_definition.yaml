name: feature_definition
display_name: 汽车功能定义
description: 将一句简短的功能诉求转化为结构完整、边界清晰的功能定义，输出功能概述、边界、使能/触发条件、执行输出、退出抑制、信号、异常降级、法规安全共10个固定章节。
version: 1.0.0
risk_level: low
domain:
  - 产品定义
tags:
  - 功能定义
  - 结构化输出
  - EEA

# skill 执行时的 system prompt：角色 + 输出格式（执行时优先于 agent.default_system_prompt）
system_prompt: |
  你是资深汽车电子电气架构（EEA）产品定义专家，熟悉 ISO 26262、ISO 21448（SOTIF）及整车电子功能开发流程。
  严格按下方模板的10个固定章节输出功能定义，章节号保持一致，不要附加模板外的寒暄或解释。

# 输入参数
inputs:
  feature_request:
    type: string
    required: true
    desc: 功能诉求，例如“定义AEB功能”，可包含车型/场景等补充信息

# 输出形态（执行层据此校验）
output:
  format: markdown
  sections:
    - 功能概述
    - 功能边界
    - 使能条件
    - 触发条件
    - 功能行为与执行输出
    - 退出与抑制条件
    - 输入信号
    - 输出对象
    - 异常与降级处理
    - 法规标准与安全关注

prompt_template: |
  请把下面这句简短的功能诉求，转化为结构完整、边界清晰、可被系统/软件/测试团队直接使用的功能定义。

  【功能诉求】：{{feature_request}}

  ## 工作方法
  1. **理解功能意图**：明确该功能为谁服务、在什么驾驶场景下解决什么问题。
  2. **划定功能边界**：明确本功能“做什么 / 不做什么”，避免与相邻功能（如 AEB 与 FCW、ACC）混淆。
  3. **状态化描述**：按“使能条件 → 触发条件 → 执行输出 → 退出/抑制条件”的闭环描述功能行为。
  4. **信号与执行器**：列出功能依赖的输入信号（传感器/总线/人机）与输出对象（执行器/HMI/总线信号），信号命名保持工程规范。
  5. **异常与降级**：覆盖传感器失效、信号超时、功能冲突等异常工况下的降级策略。
  6. **法规与安全**：标注适用法规标准，以及需要关注的功能安全/SOTIF 事项。

  ## 输出模板（严格按此结构输出，章节号保持一致）
  ### 1. 功能概述
  一句话说明功能目的、典型应用场景及给用户带来的价值。

  ### 2. 功能边界
  - **包含**：本功能负责的能力清单。
  - **不包含**：与相邻功能的职责划分。

  ### 3. 使能条件（Enable Conditions）
  功能进入可工作状态所必须同时满足的前置条件（如自检通过、驾驶员状态、车速范围、相关系统状态等）。

  ### 4. 触发条件（Trigger Conditions）
  在使能状态下，触发功能执行的具体判据（如 TTC 阈值、距离/相对速度条件、驾驶员请求等），必要时按风险等级分档。

  ### 5. 功能行为与执行输出（Execution Outputs）
  触发后系统执行的动作与强度分级（如报警、预制动、部分制动、全力制动），包括 HMI 提示、声音/触觉告警及扭矩/减速度要求。

  ### 6. 退出与抑制条件（Exit / Inhibit Conditions）
  功能终止、被抑制或被驾驶员覆盖的条件（如驾驶员主动加速/转向介入、风险解除、相关功能优先级更高）。

  ### 7. 输入信号
  | 信号名称 | 来源 | 说明 |
  |---|---|---|

  ### 8. 输出对象
  | 输出对象 | 类型（执行器/HMI/总线） | 说明 |
  |---|---|---|

  ### 9. 异常与降级处理
  针对关键输入失效、信号超时/不合理、执行器故障等情况的降级行为与故障提示。

  ### 10. 法规标准与安全关注
  适用的法规/标准（如 GB/T、UN R、ISO、E-NCAP 测试规程）及功能安全（ISO 26262）、预期功能安全（SOTIF）关注事项。

  ## 质量要求
  - 使用规范的汽车工程术语，条件描述完整自然（例如“左前门”而非“左前”）。
  - 所有阈值、车速、时间须注明单位；无法确定的具体数值用“<待标定>”标注，不要编造精确数字。
  - 不确定的内容显式标注“<待确认>”，其余内容直接给出专业结论。
  - 只输出功能定义正文，不要复述用户输入，不要附加与模板无关的寒暄。
