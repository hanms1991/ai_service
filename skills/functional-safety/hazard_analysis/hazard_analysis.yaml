name: hazard_analysis
display_name: 功能安全危害分析（HARA）
description: 基于相关项定义文档或功能/系统描述，按 ISO 26262 与团队标准模板完成整车功能枚举、11 个失效词过滤、充分场景 HAZOP 展开与逐场景 S/E/C 评级，产出 11-Sheet 团队标准 HARA 工作簿（xlsx），历史项目条目优先沿用并在备注列标注来源。
version: 4.0.0
risk_level: medium
domain:
  - 功能安全
  - 汽车电子
tags:
  - 危害分析
  - HARA
  - ASIL
  - 安全目标
  - ISO 26262

model_hint:
  reasoning: enabled

# ────────────────────────────────────────────────────────────────────
# 输入契约
# item_definition 与 file_id 二者至少提供其一（required_any）：
#   - 对话直述 → item_definition
#   - 上传相关项文档 → file_id（平台经 read_document 自动读取并追加为文档段落）
# ────────────────────────────────────────────────────────────────────
inputs:
  item_definition:
    type: string
    required: false
    desc: 分析对象/功能/系统的文字描述，例如 AEB 自动紧急制动系统的范围、功能与边界
  file_id:
    type: string
    required: false
    desc: 用户通过 /agent/files/upload 上传的相关项定义文档 file_id（docx/xlsx/pdf 等）；提供后平台自动读取文档内容用于分析
  operational_scenarios:
    type: string
    required: false
    desc: 用户特别关注的运行场景/边界条件（可选补充，场景分析以平台场景库四维穷举为准）
  known_hazards:
    type: string
    required: false
    desc: 已知危害/关注点（可选补充），多个可用顿号或分号分隔
  standard:
    type: string
    required: false
    desc: 适用标准，例如 ISO 26262；未提供时按 ISO 26262 通用 HARA 方法分析

# 条件必填：每组中至少一个输入有值，否则执行链转为对话式澄清
required_any:
  - [item_definition, file_id]

# 文档源：执行技能前把 file_id 对应文档读为 Markdown，作为只读段落追加到用户消息
document_source:
  file_id_input: file_id

# ────────────────────────────────────────────────────────────────────
# 执行模式：pipeline 线性管道（单一 run 入口，管道脚本自行驱动 LLM 与检索）
#   Step 1 identify        识别相关项与整车功能清单
#   Step 2 function_match  KB 功能清单候选 → LLM 判断沿用/改编/新增 → 物化
#   Step 3 fm_match        KB 失效模式候选 × 11 失效词 → LLM 判断 → 物化
#   Step 4 event_match     KB 事件候选 → LLM 判断（reused 只给 ref_id）→ 物化（切片并行）
#   Step 5 sg_consolidate  事件安全目标提取 + KB 参考 → LLM 合并 → 整车安全目标
#   Step 6 render          管道合并 01~05 JSON → 引擎 schema 校验 → 确定性渲染器出 xlsx
# 级联检索：每步检索参数来自上一步物化输出（KB 功能名）；差异化召回量由
# 管道脚本内置（function_list 10 / failure_mode 20/功能 / hara_event 50/功能）。
# 每步产物存临时 JSON（01~05），可调试、可断点续跑。
# ────────────────────────────────────────────────────────────────────
execution:
  mode: pipeline
  pipeline:
    script: scripts/hara_pipeline.py
    entrypoint: run
    # 以下阶段配置由管道脚本自行解释（引擎不读取）
    identify:
      system_prompt:
        file: stage_identify.md
      # 识别阶段只需域前缀映射，不加载场景库/评级规则等方法论
      references:
        - references/domain_prefixes.md
      max_tokens: 4096
    function_match:
      system_prompt:
        file: stage_function_match.md
      references:
        - references/domain_prefixes.md
      max_tokens: 8192
    failure_mode_match:
      system_prompt:
        file: stage_failure_mode_match.md
      references:
        - references/domain_prefixes.md
      max_tokens: 16384
    event_match:
      system_prompt:
        file: stage_rate.md
      max_tokens: 16384
      max_workers: 3
      user_instruction: >-
        以下是一个「功能失效单元」及其历史 HARA 事件候选清单。请按系统提示词输出
        该失效单元的完整危害事件集合：候选事件逐条判断沿用（reused，只抄 ref_id，
        评级留空由系统物化回填）/改编（adapted，填差异字段与完整评级），候选缺失的
        场景新增（new，完整评级）；实质相同场景去重。只输出 JSON 对象。
    sg_consolidate:
      system_prompt:
        file: stage_sg_consolidate.md
      references:
        - references/sec_rating_rules.md
      max_tokens: 8192

# ────────────────────────────────────────────────────────────────────
# 知识库注入（auto-kb 历史项目参考，服务地址见 agents/configs/knowledge.yaml；
# base_url 空或服务不可达时 ctx.retrieve_knowledge 由 kb_client 软降级返回空，
# 管道对应步骤自动退化为全新增，不阻断执行）：
#   管道脚本 hara_pipeline.py 按步骤调 retrieval_service 适配器：
#     function_list / failure_mode / hara_event / safety_goal 四层结构化候选，
#     每条带 ref_id/kb_id，供 LLM 逐条判断沿用/改编/新增。
# 历史 HARA xlsx 导入 auto-kb 时须按这四层标注 meta.layer。
# ────────────────────────────────────────────────────────────────────
knowledge:
  domain: 功能安全
  score_threshold: 0.3
  layers: [function_list, failure_mode, hara_event, safety_goal]

# ────────────────────────────────────────────────────────────────────
# 方法论参考（reference_files 由平台拼接在各阶段 system_prompt 之后）
# ────────────────────────────────────────────────────────────────────
reference_files:
  - references/malfunctions.md
  - references/scene_library.md
  - references/sec_rating_rules.md
  - references/domain_prefixes.md

# ────────────────────────────────────────────────────────────────────
# 输出：管道合并 JSON（轻量 schema 校验）→ 确定性渲染器生成 xlsx 交付物
# ────────────────────────────────────────────────────────────────────
output:
  format: json
  # 各阶段 token 上限在 execution.pipeline.* 单独配置；
  # 此处保留 output.max_tokens 仅作契约元数据（实际不读取）。
  max_tokens: 32768
  example_file: examples/hara_sample_output.json
  schema:
    type: object
    required: [item, functions, malfunction_matrix, hazop_items]
    properties:
      item:
        type: object
        required: [name]
        properties:
          name: {type: string}
          abbr: {type: string}
          domain_prefix: {type: string}
          doc_ref: {type: string}
      functions:
        type: array
        items:
          type: object
          required: [fid, vehicle_function]
          properties:
            fid: {type: string}
            vehicle_function: {type: string}
            doc_ref: {type: string}
            source: {type: object}
            features:
              type: array
              items:
                type: object
                properties:
                  feature_list_id: {type: string}
                  description: {type: string}
                  do_hara: {type: string}
                  no_hara_reason: {type: string}
                  doc_ref: {type: string}
      malfunction_matrix:
        type: array
        items:
          type: object
          required: [fid, selections]
          properties:
            fid: {type: string}
            selections: {type: object}
            rationale: {type: string}
            source_note: {type: string}
            source: {type: object}
      hazop_items:
        type: array
        items:
          type: object
          required: [fid, word, malfunction_behavior, vehicle_hazard]
          properties:
            fid: {type: string}
            word: {type: string}
            malfunction_behavior: {type: string}
            vehicle_hazard: {type: string}
            # events 由管道 event_match 步骤物化挂回；reused 事件的 S/E/C 与
            # 安全目标组由脚本从知识库原块逐字复制
            events:
              type: array
              items:
                type: object
                required: [scenario_text, S, E, C, source]
                properties:
                  scenario_text: {type: string}
                  event_description: {type: string}
                  S: {type: integer}
                  s_reason: {type: string}
                  # 经验做法：S=0 时 E/C 不评估输出 null；S>0 且 E=0 时 C 输出 null
                  E: {type: [integer, "null"]}
                  e_reason: {type: string}
                  C: {type: [integer, "null"]}
                  c_basis: {type: string}
                  c_reason: {type: string}
                  sg_text: {type: string}
                  safe_state: {type: string}
                  ftti: {type: string}
                  source: {type: object}
      # 整车安全目标（Step 5 产物，供追溯/下游消费；渲染器按事件文本自行合并）
      safety_goals:
        type: object
        properties:
          events_sg:
            type: array
            items: {type: object}
          merged_sg:
            type: array
            items: {type: object}
  # 渲染器：输入 JSON 写临时文件 → 调用脚本 entrypoint(input_path, output_path)
  # → xlsx 存入文件沙箱，经 /agent/files/{file_id}/download 下载
  # stat_labels：交付摘要中工作簿统计的中文标签（按声明顺序，只列 stats 中存在的键）；
  # summary_entrypoint：可选附加摘要入口 summarize(in_json, artifact_path)->markdown
  renderer:
    type: python_script
    script: scripts/generate_hara.py
    entrypoint: generate
    format: xlsx
    filename_template: "HARA_{abbr}_{date}.xlsx"
    summary_entrypoint: summarize
    stat_labels:
      functions: 整车功能数
      sc_malfunctions: 安全关键失效条目
      hara_events: HARA 危害事件数
      events_qm: QM 事件
      events_asil: ASIL≥A 显著事件
      issues_sg_missing: 缺少安全目标待人工补全
      issues_sec_check: S/E/C 待复核条目
      safety_goals_vh: 整车安全目标数（合并后）
      reused: 沿用历史条目
      adapted: 改编历史条目
      new: 新增条目
  # 交付摘要尾注（业务说明放技能契约，引擎不内置业务文案）
  summary_footer: >-
    工作簿为团队标准模板：版本管理、命名规则、相关项功能清单、
    失效模式、HAZOP 分析、HARA 分析（逐场景 S/E/C 评级，
    ASIL 按 ISO 26262 矩阵确定性反算）、整车安全目标（同文本目标自动合并取最高 ASIL）、
    参考场景与 S/E/C/ASIL 评定参考。历史沿用情况见各 sheet 备注列；
    所有 S/E/C 评级均为建议值，请逐条复核理由列后由责任人签署确认。

prompt_template: |
  请完成功能安全危害分析（HARA）。系统按线性管道自动完成：
  识别整车功能 → 对照历史项目匹配功能与失效模式（优先沿用）→ 逐失效单元
  评估危害事件与 S/E/C 评级 → 整理合并整车安全目标，最终只输出团队标准工作簿。

  【分析对象/功能描述】：{{item_definition}}
  【特别关注的运行场景】：{{operational_scenarios}}
  【已知危害/关注点】：{{known_hazards}}
  【适用标准】：{{standard}}

  要点：
  1. 若下方提供了【相关项文档】，以文档为主要事实来源提取相关项与整车功能；
  2. 危害事件场景以历史项目候选为默认答案（优先沿用），缺失场景按《运行场景库》补充；
  3. 历史项目参考优先沿用，每条目必须按要求标注 source（reused/adapted/new）；
  4. 各阶段只输出约定 JSON，不要 Markdown 代码围栏或任何解释文字。
