name: hazard_analysis
display_name: 功能安全危害分析（HARA）
description: 基于相关项定义文档或功能/系统描述，按 ISO 26262 与团队标准模板完成整车功能枚举、11 个失效词过滤、充分场景 HAZOP 展开与逐场景 S/E/C 评级，产出 11-Sheet 团队标准 HARA 工作簿（xlsx），历史项目条目优先沿用并在备注列标注来源。
version: 3.0.0
risk_level: medium
domain:
  - 功能安全
  - 汽车电子
tags:
  - 危害分析
  - HARA
  - ASIL
  - 安全目标
  - ISO 26262

model_hint:
  reasoning: enabled

# ────────────────────────────────────────────────────────────────────
# 输入契约
# item_definition 与 file_id 二者至少提供其一（required_any）：
#   - 对话直述 → item_definition
#   - 上传相关项文档 → file_id（平台经 read_document 自动读取并追加为文档段落）
# ────────────────────────────────────────────────────────────────────
inputs:
  item_definition:
    type: string
    required: false
    desc: 分析对象/功能/系统的文字描述，例如 AEB 自动紧急制动系统的范围、功能与边界
  file_id:
    type: string
    required: false
    desc: 用户通过 /agent/files/upload 上传的相关项定义文档 file_id（docx/xlsx/pdf 等）；提供后平台自动读取文档内容用于分析
  operational_scenarios:
    type: string
    required: false
    desc: 用户特别关注的运行场景/边界条件（可选补充，场景分析以平台场景库四维穷举为准）
  known_hazards:
    type: string
    required: false
    desc: 已知危害/关注点（可选补充），多个可用顿号或分号分隔
  standard:
    type: string
    required: false
    desc: 适用标准，例如 ISO 26262；未提供时按 ISO 26262 通用 HARA 方法分析

# 条件必填：每组中至少一个输入有值，否则执行链转为对话式澄清
required_any:
  - [item_definition, file_id]

# 文档源：执行技能前把 file_id 对应文档读为 Markdown，作为只读段落追加到用户消息
document_source:
  file_id_input: file_id

# ────────────────────────────────────────────────────────────────────
# 执行模式：map_reduce 三阶段
#   prepare（技能脚本 hara_prepare.py）：识别相关项与整车功能清单 → 按功能精准检索
#   plan（1 次）：相关项/功能/失效矩阵/HAZOP 条目（含充分场景清单）
#   map （N 次并发）：逐失效单元对完整场景清单做 S/E/C 评级，事件挂回切片
# 切片即规划输出的 hazop_items；合并后经 schema 校验 → 确定性渲染器出 xlsx。
# ────────────────────────────────────────────────────────────────────
execution:
  mode: map_reduce
  # 技能侧前置钩子（识别整车功能 → 功能级精准检索历史库）：
  # 引擎只加载 script/entrypoint；prepare 段内其余配置由 hara_prepare.py 自行解释。
  # 钩子失败/零命中时引擎自动回退 item_definition 或文档头部粗召回，不阻断执行。
  prepare:
    script: scripts/hara_prepare.py
    entrypoint: prepare
    identify:
      enabled: true
      system_prompt:
        file: stage_identify.md
      # 识别阶段只需域前缀映射，不加载场景库/评级规则等方法论
      references:
        - references/domain_prefixes.md
      max_tokens: 4096
  plan:
    system_prompt:
      file: stage_plan.md
    max_tokens: 32768
    # 规划后处理钩子（复用 prepare.script 同模块，入口 fix_plan_items）——
    # 知识库优先，纯代码不调 LLM，异常软降级保留规划层原输出：
    #   第-1步 功能清单覆盖：Feature 描述按 feature_list_id 用知识库原文覆盖；
    #   第0步 按功能检索知识库全部历史失效模式（malfunction_behavior/vehicle_hazard 原文）；
    #   第1步 reused/缺省条目按 fid+word 匹配知识库，强制用库原文覆盖并置
    #         reused+修正 ref_id；adapted 条目保留 LLM 改编文本不覆盖；
    #   第1.5步 知识库有而 LLM 未生成的失效强制追加（宁多勿漏），并同步失效矩阵 selections；
    #   第2步 场景骨架：场景按 history_ref 用库原文对齐、无效引用剥离、
    #         候选中未被引用的历史事件按实质去重后强制追加（宁多勿漏）。
    postprocess_entrypoint: fix_plan_items
  map:
    system_prompt:
      file: stage_rate.md
    slice_path: hazop_items
    events_key: events
    max_workers: 3
    max_tokens: 16384
    # 每切片历史事件检索钩子（复用 prepare.script 同模块，默认入口 retrieve_map）：
    # 按「整车功能+失效词」锚定多路并集召回该失效全部历史 HARA 事件；
    # 钩子异常/未声明时引擎回退通用单路检索（knowledge.map_layer/map_top_k）。
    retrieve_entrypoint: retrieve_map
    query_fields: [word, malfunction_behavior, vehicle_hazard]
    user_instruction: >-
      以下是一个「功能失效单元」，其中 scenarios 给出该失效需要分析的场景清单。
      请按系统提示词的「场景并集」规则处理：先对清单中每个场景输出一条 HARA 事件，
      再把历史参考中同功能同失效、清单缺失的历史事件补录为 reused 事件，
      实质相同场景去重；只输出 JSON 对象。
    # 评审钩子（复用 prepare.script 同模块）：代码比对全部事件 source 标注与本次
    # 召回候选，疑似项（漏标沿用/虚引 ID/评级与所引不一致）回炉大模型二次校验；
    # 代码不改标，改判由复核 LLM 决定；异常软降级保留原评级结果。
    review_entrypoint: review_events
    review:
      system_prompt:
        file: stage_review.md
      max_tokens: 16384
      # 「标 new 但与历史场景相似度≥阈值且 S/E/C 一致」视为疑似漏标沿用
      scene_sim_threshold: 0.70

# ────────────────────────────────────────────────────────────────────
# 知识库注入（auto-kb 历史项目参考，服务地址见 agents/configs/knowledge.yaml；
# base_url 留空或服务不可达时自动跳过，不阻断执行）：
#   prepare 钩子（hara_prepare.py）：按识别出的每个整车功能——
#     q1「相关项名+功能名」综合召回 identify_func_top_k；
#     q2「功能名 失效模式」专项召回 failure_mode 层 identify_fm_top_k；
#     q3+ 以 q2 命中的每个历史失效为单位，按 map_event_facets 多路并集召回
#         其全部历史 HARA 事件（prepare_event_recall=false 可关闭），
#         供规划层以历史场景为骨架枚举，保证场景逐条对齐；
#   回退粗召回：一次大召回（plan_top_k），按 meta.layer 四层分组注入；
#   评级层：retrieve_map 钩子对每切片按「功能+失效词」锚定多路并集召回
#     hara_event 层（服务端单次硬上限 20 块，故多路；每路 map_event_top_k，
#     去重后封顶 map_event_cap）；钩子未启用时退化为单路 map_top_k。
# 历史 HARA xlsx 导入 auto-kb 时须按这四层标注 meta.layer。
# ────────────────────────────────────────────────────────────────────
knowledge:
  domain: 功能安全
  # query_from 仅作用于引擎粗召回兜底路径（prepare 钩子失败/零命中时的一次性
  # 大召回）：取 inputs[query_from] 构造 query，为空时降级用文档正文前 500 字符。
  # HARA 主路径（prepare 钩子）检索用的是识别出的整车功能名，不依赖此键。
  query_from: item_definition
  top_k: 5
  score_threshold: 0.3
  identify_func_top_k: 10
  identify_fm_top_k: 10
  prepare_event_recall: true
  plan_top_k: 40
  layers: [function_list, failure_mode, hara_event, safety_goal]
  map_layer: hara_event
  map_top_k: 8
  map_event_top_k: 20
  map_event_cap: 45
  retrieve_workers: 8
  # 规划层分层注入篇幅上限（kb_client 默认仅 2 万字，装不下全量历史事件；
  # 约 6 万字≈3 万 token，为多功能全量事件+文档+输出预留 128k 上下文）
  layered_block_max_chars: 120000
  layered_chunk_max_chars: 1200
  # 场景面：每切片在锚定/长描述两路之外，按这些场景切面补召回（覆盖面用）
  map_event_facets:
    - "高速 直行 道路 行驶"
    - "低速 转弯 泊车 停车位"
    - "弯道 变道 超车"
    - "湿滑 路面 附着"
    - "行人 车辆 碰撞 追尾"
    - "静止 停车 无事故 原地"
    - "颠簸 减速带 紧急避让"

# ────────────────────────────────────────────────────────────────────
# 方法论参考（reference_files 由平台拼接在各阶段 system_prompt 之后）
# ────────────────────────────────────────────────────────────────────
reference_files:
  - references/malfunctions.md
  - references/scene_library.md
  - references/sec_rating_rules.md
  - references/domain_prefixes.md

# ────────────────────────────────────────────────────────────────────
# 输出：两阶段合并 JSON（轻量 schema 校验）→ 确定性渲染器生成 xlsx 交付物
# ────────────────────────────────────────────────────────────────────
output:
  format: json
  # 各阶段 token 上限在 execution.plan/map.max_tokens 单独配置；
  # 此处保留 output.max_tokens 仅作契约元数据（实际不读取）。
  max_tokens: 32768
  example_file: examples/hara_sample_output.json
  schema:
    type: object
    required: [item, functions, malfunction_matrix, hazop_items]
    properties:
      item:
        type: object
        required: [name]
        properties:
          name: {type: string}
          abbr: {type: string}
          domain_prefix: {type: string}
          doc_ref: {type: string}
      functions:
        type: array
        items:
          type: object
          required: [fid, vehicle_function]
          properties:
            fid: {type: string}
            vehicle_function: {type: string}
            doc_ref: {type: string}
            source: {type: object}
            features:
              type: array
              items:
                type: object
                properties:
                  feature_list_id: {type: string}
                  description: {type: string}
                  do_hara: {type: string}
                  no_hara_reason: {type: string}
                  doc_ref: {type: string}
      malfunction_matrix:
        type: array
        items:
          type: object
          required: [fid, selections]
          properties:
            fid: {type: string}
            selections: {type: object}
            rationale: {type: string}
            source_note: {type: string}
            source: {type: object}
      hazop_items:
        type: array
        items:
          type: object
          required: [fid, word, malfunction_behavior, vehicle_hazard, scenarios]
          properties:
            fid: {type: string}
            word: {type: string}
            malfunction_behavior: {type: string, description: "标 reused（知识库已有该功能该失效）时留空串，系统按知识库原文自动填充；标 adapted/new 时由你撰写完整文本"}
            vehicle_hazard: {type: string, description: "同上：reused 留空串由系统填充，adapted/new 撰写完整文本"}
            source_note: {type: string}
            source: {type: object}
            scenarios:
              type: array
              items:
                type: object
                required: [scene_text]
                properties:
                  scene_text: {type: string}
                  # 历史场景骨架：来自历史事件的场景携带其事件 ID（规划后处理
                  # 按此回查知识库原文校正 scene_text；无效引用自动剥离）
                  history_ref: {type: string}
                  scene_refs:
                    type: array
                    items: {type: string}
            # events 由评级层（map）回填；规划层输出不含此字段
            events:
              type: array
              items:
                type: object
                required: [scenario_text, S, E, C, source]
                properties:
                  scenario_text: {type: string}
                  scene_refs:
                    type: array
                    items: {type: string}
                  event_description: {type: string}
                  S: {type: integer}
                  s_reason: {type: string}
                  # 经验做法：S=0 时 E/C 不评估输出 null；S>0 且 E=0 时 C 输出 null
                  E: {type: [integer, "null"]}
                  e_reason: {type: string}
                  C: {type: [integer, "null"]}
                  c_basis: {type: string}
                  c_reason: {type: string}
                  sg_text: {type: string}
                  safe_state: {type: string}
                  ftti: {type: string}
                  source: {type: object}
  # 渲染器：输入 JSON 写临时文件 → 调用脚本 entrypoint(input_path, output_path)
  # → xlsx 存入文件沙箱，经 /agent/files/{file_id}/download 下载
  # stat_labels：交付摘要中工作簿统计的中文标签（按声明顺序，只列 stats 中存在的键）；
  # summary_entrypoint：可选附加摘要入口 summarize(in_json, artifact_path)->markdown
  renderer:
    type: python_script
    script: scripts/generate_hara.py
    entrypoint: generate
    format: xlsx
    filename_template: "HARA_{abbr}_{date}.xlsx"
    summary_entrypoint: summarize
    stat_labels:
      functions: 整车功能数
      sc_malfunctions: 安全关键失效条目
      hara_events: HARA 危害事件数
      events_qm: QM 事件
      events_asil: ASIL≥A 显著事件
      safety_goals_vh: 整车安全目标数（合并后）
      reused: 沿用历史条目
      adapted: 改编历史条目
      new: 新增条目
  # 交付摘要尾注（业务说明放技能契约，引擎不内置业务文案）
  summary_footer: >-
    工作簿为团队标准 11-Sheet 模板：版本管理、命名规则、相关项功能清单、
    失效模式（11 个标准失效词）、HAZOP 分析、HARA 分析（逐场景 S/E/C 评级，
    ASIL 按 ISO 26262 矩阵确定性反算）、整车安全目标（同文本目标自动合并取最高 ASIL）、
    参考场景与 S/E/C/ASIL 评定参考。历史沿用情况见各 sheet 备注列；
    所有 S/E/C 评级均为建议值，请逐条复核理由列后由责任人签署确认。

prompt_template: |
  请完成功能安全危害分析（HARA）。分析分两个阶段由系统自动完成：
  先规划整车功能、11 个失效词过滤与每个安全关键失效的完整运行场景清单，
  再逐场景完成 S/E/C 评级与安全目标挂接，最终只输出团队标准工作簿。

  【分析对象/功能描述】：{{item_definition}}
  【特别关注的运行场景】：{{operational_scenarios}}
  【已知危害/关注点】：{{known_hazards}}
  【适用标准】：{{standard}}

  要点：
  1. 若下方提供了【相关项文档】，以文档为主要事实来源提取相关项与整车功能；
  2. 场景分析以平台《运行场景库》四个维度穷举为准，用户补充场景只作增量提示；
  3. 历史项目参考优先沿用，每条目必须按要求标注 source（reused/adapted/new）；
  4. 各阶段只输出约定 JSON，不要 Markdown 代码围栏或任何解释文字。
